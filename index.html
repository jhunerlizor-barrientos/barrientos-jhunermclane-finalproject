<!doctype html>
<html>
  <head>
    <title>Simple Shop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="header">
      <h1>My Simple Store</h1>
      <div class="cart-icon">🛒 Cart: <span id="cart-count">0</span></div>
    </div>

    <div class="main-container">
      <div id="product-list" class="product-grid"></div>

      <div class="cart-section">
        <h2>Your Shopping Cart</h2>
        <div id="cart-items"></div>
        <hr />
        <div class="cart-total">
          <strong>Total: $</strong><span id="total-price">0</span>
        </div>
        <button onclick="clearCart()" class="clear-btn">Clear All</button>
        <button onclick="checkout()" class="checkout-btn">Checkout</button>
      </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
